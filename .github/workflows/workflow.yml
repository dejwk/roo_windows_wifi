name: CI

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: dejwk/roo_testing/.github/workflows/client-ci.yml@95ecaae3c28b3b6a46f65b215029a4d30a587606 # roo_testing 2.1.2
    with:
      profiles: '["arduino"]'
      run_tests: false
      system_packages: libx11-dev libjpeg-dev libpng-dev zlib1g-dev
